name: Build and Push Containers to GHCR

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies and export Expo Web
        run: |
          npm ci
          npx expo export --platform web

      - name: Build and push Web container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sistema-centro-fashion-web:latest
            ghcr.io/${{ github.repository_owner }}/sistema-centro-fashion-web:${{ github.sha }}

      - name: Build and push Backend API container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sistema-centro-fashion-api:latest
            ghcr.io/${{ github.repository_owner }}/sistema-centro-fashion-api:${{ github.sha }}
